services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hawkeye
      POSTGRES_PASSWORD: hawkeye
      POSTGRES_DB: hawkeye
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hawkeye -d hawkeye"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - hawkeye-db:/var/lib/postgresql/data
volumes:
  hawkeye-db:
